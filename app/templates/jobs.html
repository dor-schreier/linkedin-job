<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Finder — Jobs</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>
    .htmx-request { opacity: 0.5; transition: opacity 0.2s; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">

  <!-- Nav Bar -->
  <nav class="bg-white border-b border-gray-200 px-6 py-3 flex items-center justify-between">
    <span class="text-lg font-bold text-gray-800">Job Finder</span>
    <div class="flex gap-6">
      <a href="/jobs" class="text-sm text-blue-600 font-normal border-b-2 border-blue-600 pb-0.5">Jobs</a>
      <a href="/profile" class="text-sm text-gray-600 hover:text-gray-900">Profile</a>
      <a href="/search-config" class="text-sm text-gray-600 hover:text-gray-900">Search Config</a>
      <a href="/watch-rules" class="text-sm text-gray-600 hover:text-gray-900">Watch Rules</a>
    </div>
  </nav>

  <div class="max-w-4xl mx-auto px-4 py-8">
    <h1 class="text-2xl font-bold text-gray-800 mb-6">Jobs</h1>

    <!-- Filter Bar -->
    <form
      hx-get="/jobs"
      hx-trigger="change"
      hx-target="#job-list"
      hx-swap="innerHTML"
      hx-indicator="#job-list"
      class="bg-white border border-gray-200 rounded-lg p-4 mb-6 flex flex-wrap gap-4 items-end"
    >
      <div>
        <label for="filter-status" class="block text-sm font-normal text-gray-700 tracking-wide mb-1">Status</label>
        <select
          id="filter-status"
          name="status"
          class="border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
          <option value="" {% if not filters.status %}selected{% endif %}>All Statuses</option>
          {% for s in job_statuses %}
          <option value="{{ s }}" {% if filters.status == s %}selected{% endif %}>{{ s | capitalize }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label for="filter-company" class="block text-sm font-normal text-gray-700 tracking-wide mb-1">Company</label>
        <input
          id="filter-company"
          name="company"
          type="text"
          value="{{ filters.company }}"
          placeholder="Filter by company"
          class="border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>
      <div>
        <label for="filter-salary" class="block text-sm font-normal text-gray-700 tracking-wide mb-1">Min Salary</label>
        <input
          id="filter-salary"
          name="salary_min"
          type="number"
          value="{{ filters.salary_min }}"
          placeholder="e.g. 80000"
          class="border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>
      <a href="/jobs" class="text-sm text-gray-500 underline self-end pb-2">Reset</a>
    </form>

    <!-- Job List (partial target) -->
    <div id="job-list">
      {% include "partials/job_list.html" %}
    </div>
  </div>

</body>
</html>
