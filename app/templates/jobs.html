<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Finder — Jobs</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            headline: ['Manrope', 'sans-serif'],
            body: ['Inter', 'sans-serif'],
            label: ['Inter', 'sans-serif'],
          },
          colors: {
            background: '#0f1117',
            surface: '#1a1d27',
            'surface-bright': '#252836',
            'surface-container-lowest': '#12141e',
            'surface-container-low': '#1e2130',
            'surface-container': '#222538',
            'surface-container-high': '#272a3d',
            'surface-container-highest': '#2d3045',
            'on-surface': '#e2e4f0',
            'on-surface-variant': '#9da3bd',
            outline: '#565d78',
            'outline-variant': '#3a3f56',
            primary: '#565e74',
            'on-primary': '#ffffff',
            'primary-container': '#2e3348',
            'on-primary-container': '#c5cbdf',
            'primary-dim': '#8891a8',
            'primary-fixed-dim': '#3d4358',
            secondary: '#7b8299',
            'secondary-container': '#2a2f44',
            'on-secondary-container': '#b8bdd0',
            error: '#cf6679',
            'on-error': '#ffffff',
          },
        },
      },
    }
  </script>
  <style>
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; vertical-align: middle; }
    body { font-family: 'Inter', sans-serif; }
    h1, h2, h3, .font-headline { font-family: 'Manrope', sans-serif; }
    .htmx-request { opacity: 0.5; transition: opacity 0.2s; }
  </style>
</head>
<body class="bg-background text-on-surface min-h-screen">

  {% include "partials/nav.html" %}

  <div class="ml-64 min-h-screen">
    <header class="sticky top-0 z-50 bg-surface/80 backdrop-blur-md flex items-center justify-between px-8 py-4 border-b border-outline-variant/15">
      <h2 class="text-xl font-bold font-headline tracking-tight">Ranked Feed</h2>
      <div class="relative">
        <span class="absolute inset-y-0 left-3 flex items-center text-outline">
          <span class="material-symbols-outlined text-lg">search</span>
        </span>
        <input name="q" class="pl-10 pr-4 py-2 bg-surface-container-low border-none rounded-full text-sm w-72 focus:ring-2 focus:ring-primary/20" placeholder="Search listings…" />
      </div>
    </header>

    <div class="px-8 py-6">
      <!-- Filter Bar -->
      <form
        hx-get="/jobs"
        hx-trigger="change"
        hx-target="#job-list"
        hx-swap="innerHTML"
        hx-indicator="#job-list"
        class="mb-8 flex flex-wrap items-center justify-between gap-4"
      >
        <div class="flex items-center gap-3">
          <button type="button" class="flex items-center gap-2 px-4 py-2 bg-surface-container-lowest rounded-lg text-sm font-medium shadow-sm hover:bg-surface-container-low transition-colors">
            <span class="material-symbols-outlined text-lg">filter_list</span>
            All Filters
          </button>
          <div class="h-5 w-px bg-outline-variant/30"></div>
          <div>
            <select
              id="filter-status"
              name="status"
              class="bg-transparent border-none text-sm font-medium text-on-surface-variant focus:ring-0"
            >
              <option value="" {% if not filters.status %}selected{% endif %}>All Statuses</option>
              {% for s in job_statuses %}
              <option value="{{ s }}" {% if filters.status == s %}selected{% endif %}>{{ s | capitalize }}</option>
              {% endfor %}
            </select>
          </div>
          <div>
            <input
              id="filter-company"
              name="company"
              type="text"
              value="{{ filters.company }}"
              placeholder="Company"
              class="bg-transparent border-none text-sm font-medium text-on-surface-variant focus:ring-0 placeholder:text-outline"
            />
          </div>
          <div>
            <input
              id="filter-salary"
              name="salary_min"
              type="number"
              value="{{ filters.salary_min }}"
              placeholder="Min salary"
              class="bg-transparent border-none text-sm font-medium text-on-surface-variant focus:ring-0 placeholder:text-outline w-28"
            />
          </div>
          <a href="/jobs" class="text-sm text-outline hover:text-on-surface">Reset</a>
        </div>
        <p class="text-xs font-medium text-outline">Showing {{ jobs|length }} positions</p>
      </form>

      <!-- Job List (partial target) -->
      <div id="job-list">
        {% include "partials/job_list.html" %}
      </div>
    </div>
  </div>

</body>
</html>
