{# Render a single reject rule row. Expects: r (RejectRule), rule_counts (dict). #}
<div class="flex items-center gap-3 bg-surface-container rounded-lg p-3">
  <div class="flex-1 min-w-0">
    <p class="text-sm font-medium text-on-surface {% if not r.is_enabled %}line-through opacity-50{% endif %}">
      {% if r.rule_type == 'property' %}<span class="text-xs uppercase tracking-wider text-outline mr-2">{{ r.property_name }}:</span>{% endif %}
      {{ r.value }}
    </p>
    <p class="text-[11px] text-outline mt-0.5">
      {{ rule_counts.get(r.id, 0) }} jobs rejected
      {% if r.created_at %} · created {{ r.created_at.strftime('%Y-%m-%d') }}{% endif %}
    </p>
  </div>
  <form action="/settings/reject-rules/{{ r.id }}/toggle" method="post" class="flex items-center">
    <button type="submit" class="relative w-10 h-5 rounded-full transition-colors {% if r.is_enabled %}bg-primary{% else %}bg-surface-container-high{% endif %}" title="Toggle">
      <span class="absolute top-0.5 {% if r.is_enabled %}right-0.5{% else %}left-0.5{% endif %} w-4 h-4 bg-white rounded-full shadow"></span>
    </button>
  </form>
  <form action="/settings/reject-rules/{{ r.id }}/delete" method="post"
        onsubmit="return confirm('This will un-reject {{ rule_counts.get(r.id, 0) }} jobs unless other rules also match them.');">
    <button type="submit" class="p-1 text-outline hover:text-error" title="Delete">
      <span class="material-symbols-outlined text-[18px]">delete</span>
    </button>
  </form>
</div>
