{% if bullets %}
<ul class="space-y-1 text-sm text-on-surface-variant bg-surface-container-low/50 p-3 rounded-lg border-l-2 border-primary-fixed-dim">
  {% for b in bullets %}
  <li class="flex items-start gap-2">
    <span class="material-symbols-outlined text-primary-dim text-[14px] mt-0.5">chevron_right</span>
    {{ b }}
  </li>
  {% endfor %}
</ul>
{% else %}
<p class="text-sm text-on-surface-variant">No recommendations yet. Click "Analyze Profile" to generate suggestions.</p>
{% endif %}
