{% if job.fit_score is not none %}
  <div class="mt-2 pt-2 space-y-1">
    <div class="flex items-center gap-2">
      <span class="text-xs font-bold text-on-surface">Fit: {{ job.fit_score }}/100</span>
      <span class="text-xs px-2 py-0.5 rounded
        {% if label == 'Excellent' %}bg-primary-container text-on-primary-container
        {% elif label == 'Good' %}bg-surface-container-high text-on-surface
        {% elif label == 'Fair' %}bg-surface-container text-on-surface-variant
        {% else %}bg-surface-container text-outline{% endif %}">{{ label }}</span>
    </div>
    {% if job.fit_summary %}
    <p class="text-xs text-on-surface-variant">{{ job.fit_summary }}</p>
    {% endif %}
    {% if job.salary_estimated and not (job.salary_min and job.salary_max) %}
    <p class="text-xs text-on-surface-variant"><span class="font-bold">Estimated:</span> {{ job.salary_estimated }}</p>
    {% endif %}
  </div>
{% endif %}
