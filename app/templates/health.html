<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Finder — Health Check</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            headline: ['Manrope', 'sans-serif'],
            body: ['Inter', 'sans-serif'],
            label: ['Inter', 'sans-serif'],
          },
          colors: {
            background: '#0f1117',
            surface: '#1a1d27',
            'surface-bright': '#252836',
            'surface-container-lowest': '#12141e',
            'surface-container-low': '#1e2130',
            'surface-container': '#222538',
            'surface-container-high': '#272a3d',
            'surface-container-highest': '#2d3045',
            'on-surface': '#e2e4f0',
            'on-surface-variant': '#9da3bd',
            outline: '#565d78',
            'outline-variant': '#3a3f56',
            primary: '#565e74',
            'on-primary': '#ffffff',
            'primary-container': '#2e3348',
            'on-primary-container': '#c5cbdf',
            'primary-dim': '#8891a8',
            'primary-fixed-dim': '#3d4358',
            secondary: '#7b8299',
            'secondary-container': '#2a2f44',
            'on-secondary-container': '#b8bdd0',
            error: '#cf6679',
            'on-error': '#ffffff',
          },
        },
      },
    }
  </script>
  <style>
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; vertical-align: middle; }
    body { font-family: 'Inter', sans-serif; }
    h1, h2, h3, .font-headline { font-family: 'Manrope', sans-serif; }
    .htmx-request { opacity: 0.5; transition: opacity 0.2s; }
  </style>
</head>
<body class="bg-background text-on-surface min-h-screen">
  {% include "partials/nav.html" %}
  <div class="ml-64 min-h-screen">
    <header class="sticky top-0 z-50 bg-surface/80 backdrop-blur-md px-8 py-4 border-b border-outline-variant/15 flex items-center justify-between">
      <h2 class="text-xl font-bold font-headline">Health Check</h2>
    </header>

    <div class="px-8 py-6 max-w-xl mx-auto">
      <div class="bg-surface-container-lowest rounded-xl p-6 space-y-3">
        <p class="text-sm text-on-surface-variant">Status: <span class="text-on-surface font-medium">{{ status }}</span></p>
        <p class="text-sm text-on-surface-variant">Database: <span class="text-on-surface font-medium">{{ "OK" if db_exists else "MISSING" }}</span></p>
        <p class="text-sm text-on-surface-variant">Tables: <span class="text-on-surface font-medium">{{ table_count }}</span></p>
        <p class="text-sm text-on-surface-variant">WAL Mode: <span class="text-on-surface font-medium">{{ "ON" if wal_mode else "OFF" }}</span></p>
      </div>
    </div>
  </div>
</body>
</html>
