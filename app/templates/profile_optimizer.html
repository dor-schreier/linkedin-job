<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Finder — Profile Optimizer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>.htmx-request { opacity: 0.5; transition: opacity 0.2s; }</style>
</head>
<body class="bg-gray-100 min-h-screen">
  {% include "partials/nav.html" %}

  <div class="max-w-4xl mx-auto px-4 py-8">
    <div class="flex items-center justify-between mb-6">
      <h1 class="text-2xl font-bold text-gray-800">LinkedIn Profile Optimizer</h1>
      <div class="flex items-center gap-4">
        {% if analyzed_at %}
          <span class="text-sm text-gray-500">Last analyzed: {{ analyzed_at.strftime('%b %d, %Y %H:%M') }}</span>
        {% endif %}
        <button
          hx-post="/profile-optimizer/analyze"
          hx-target="#analysis-result"
          hx-swap="innerHTML"
          hx-indicator="#analysis-result"
          class="text-sm border border-blue-300 text-blue-700 rounded px-3 py-1 hover:bg-blue-50">
          Analyze Now
        </button>
      </div>
    </div>

    <div id="analysis-result">
      {% if analysis %}
        {% include "partials/linkedin_analysis.html" %}
      {% else %}
        <p class="text-sm text-gray-500">No analysis yet. Click Analyze Now.</p>
      {% endif %}
    </div>
  </div>
</body>
</html>
