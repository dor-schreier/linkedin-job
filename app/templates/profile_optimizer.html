<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Finder — Profile Optimizer</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            headline: ['Manrope', 'sans-serif'],
            body: ['Inter', 'sans-serif'],
            label: ['Inter', 'sans-serif'],
          },
          colors: {
            background: '#0f1117',
            surface: '#1a1d27',
            'surface-bright': '#252836',
            'surface-container-lowest': '#12141e',
            'surface-container-low': '#1e2130',
            'surface-container': '#222538',
            'surface-container-high': '#272a3d',
            'surface-container-highest': '#2d3045',
            'on-surface': '#e2e4f0',
            'on-surface-variant': '#9da3bd',
            outline: '#565d78',
            'outline-variant': '#3a3f56',
            primary: '#565e74',
            'on-primary': '#ffffff',
            'primary-container': '#2e3348',
            'on-primary-container': '#c5cbdf',
            'primary-dim': '#8891a8',
            'primary-fixed-dim': '#3d4358',
            secondary: '#7b8299',
            'secondary-container': '#2a2f44',
            'on-secondary-container': '#b8bdd0',
            error: '#cf6679',
            'on-error': '#ffffff',
          },
        },
      },
    }
  </script>
  <style>
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; vertical-align: middle; }
    body { font-family: 'Inter', sans-serif; }
    h1, h2, h3, .font-headline { font-family: 'Manrope', sans-serif; }
    .htmx-request { opacity: 0.5; transition: opacity 0.2s; }
  </style>
</head>
<body class="bg-background text-on-surface min-h-screen">
  {% include "partials/nav.html" %}

  <div id="app-content" class="min-h-screen" style="margin-left: 256px">
    <header class="sticky top-0 z-50 bg-surface/80 backdrop-blur-md px-8 py-4 border-b border-outline-variant/15 flex items-center justify-between">
      <h2 class="text-xl font-bold font-headline">Profile Optimizer</h2>
      <div class="flex items-center gap-4">
        {% if analyzed_at %}
          <span class="text-sm text-outline">Last analyzed: {{ analyzed_at.strftime('%b %d, %Y %H:%M') }}</span>
        {% endif %}
        <button
          hx-post="/profile-optimizer/analyze"
          hx-target="#analysis-result"
          hx-swap="innerHTML"
          hx-indicator="#analysis-result"
          class="flex items-center gap-2 py-2 px-4 bg-primary text-on-primary rounded-lg font-bold text-sm hover:opacity-90 transition-opacity">
          <span class="material-symbols-outlined text-[18px]">auto_awesome</span>
          Analyze Now
        </button>
      </div>
    </header>

    <div class="px-8 py-6 max-w-4xl mx-auto">
      <div id="analysis-result">
        {% if analysis %}
          {% include "partials/linkedin_analysis.html" %}
        {% else %}
          <p class="text-sm text-on-surface-variant">No analysis yet. Click Analyze Now.</p>
        {% endif %}
      </div>
    </div>
  </div>
</body>
</html>
